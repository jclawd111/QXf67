name: Apply verified devnet update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify archive and apply exact source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          archive = Path('devnet-update-20261104.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '526d51a702cfe7f17ae7da0fb0d86fd5936328e9bebb8d400b71bd9119f7eec0'
          expected = {'README.md': '20fcbc6a8aa59b2e3b1ccec05f40c5eb64ee017cdda28a9c3d63547723fe5ae0', 'components/qsafe/shell.tsx': '8d0a8042e438993a5d6351f6aef3d4aab1b73e6e6d65dbae0dee240ab1227a0d', 'docs/devnet-deployment.json': 'de8d4264e45b6762bfd67785bf81ece724ded812ca4746df453809a42f47e5f7', 'docs/devnet-smoke.json': 'aabad1b3946eeb93a521954e88049e7c83dc909dd853b0a5e2d8bc88d96247a3', 'scripts/devnet/deploy.ts': '11c3c7807de480da8fc5017ab56e6741e9b8ca5e4c043091b8ddfd43a210d091', 'scripts/devnet/loader.ts': '028966599a93e46c73d4ca2c6812f9125f186e9787bb34b62e807851070e1b63', 'scripts/devnet/rpc.ts': 'e11eee15895d48a16587f3115e56816b97f73f608f383e03f089923d69f6fdbe', 'scripts/devnet/smoke.ts': '219842724d23060e80ef553241e8b9d726b0d06d625743ac6a37b4260b748e81', 'tests/browser/devnet-profile.spec.ts': '9adb7b99db1e860a75357f520bff959b5aff6b3b70bbe217928a487d91174e26', 'tests/devnet-rpc.test.ts': 'a49c37830bed17528421b0c2bf7975d148b47084323c65ed6bfb614f7bf1ee3a', 'tests/devnet.test.ts': '9ec4f0f91a5b1853101b1f4bf13247410f2088113c090d6c38f710fafb59ac83'}
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist()) == set(expected)
              assert len(z.namelist()) == len(expected)
              for name, digest in expected.items():
                  assert hashlib.sha256(z.read(name)).hexdigest() == digest
              z.extractall('.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md components/qsafe/shell.tsx docs/devnet-deployment.json docs/devnet-smoke.json scripts/devnet/deploy.ts scripts/devnet/loader.ts scripts/devnet/rpc.ts scripts/devnet/smoke.ts tests/browser/devnet-profile.spec.ts tests/devnet-rpc.test.ts tests/devnet.test.ts
          git rm -- devnet-update-20261104.zip .github/workflows/apply-devnet-update.yml
          git commit -m 'Publish verified devnet vault, live receipts and RPC fixes'
          git push origin HEAD:main
